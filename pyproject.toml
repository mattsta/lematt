[project]
name = "lematt"
version = "3.0.0"
description = "Matt's Let's Encrypt Automation - Certificate management with parallel processing"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
authors = [
    { name = "Matt", email = "matt@example.com" }
]
keywords = ["letsencrypt", "acme", "ssl", "tls", "certificates", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

# Required dependencies (tomllib is stdlib in Python 3.11+)
dependencies = [
    "cryptography>=46", # Keys, CSRs, certificate parsing
    "httpx>=0.28", # ACME and challenge self-check HTTP client
    "loguru>=0.7.3", # Modern structured logging
    "rich>=15.0", # Beautiful terminal output, tables, progress bars
    "textual>=8.2", # Interactive TUI framework
]

[project.optional-dependencies]
# Former extras; cryptography is now always installed. Kept so existing
# `lematt[crypto]` / `lematt[full]` installs keep working.
crypto = []
full = []

[project.scripts]
lematt = "lematt.cli:main"

[project.urls]
Homepage = "https://github.com/mattsta/lematt"
Documentation = "https://matt.sh/lematt"
Repository = "https://github.com/mattsta/lematt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lematt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lematt",
    "conf",
    "contrib",
    "docs",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "I",    # import sorting
    "UP",   # pyupgrade
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "PLE",  # pylint errors
]
ignore = [
    "E501",    # line length (the formatter handles wrapping)
    "RUF001",  # status glyphs like ✓ ✗ ⚠ are intentional
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4", # Textual dashboard tests
    "mypy>=2.4",
    "ruff>=0.17",
]
